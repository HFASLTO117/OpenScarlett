name: Windows CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Windows x64 (${{ matrix.build_type }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC x64 developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Ensure Ninja and verify toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            $vsNinja = Join-Path $env:VSINSTALLDIR "Common7\IDE\CommonExtensions\Microsoft\CMake\Ninja"
            if (Test-Path (Join-Path $vsNinja "ninja.exe")) {
              Add-Content -Path $env:GITHUB_PATH -Value $vsNinja
              $env:PATH = "$vsNinja;$env:PATH"
            } else {
              choco install ninja -y --no-progress
            }
          }
          cmake --version
          ninja --version
          python --version

      - name: Configure (CMake + Ninja)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake --build build --parallel

      - name: Run CTest suite
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $saveRoot = Join-Path $env:RUNNER_TEMP "openscarlett_saves_${{ matrix.build_type }}"
          New-Item -ItemType Directory -Force -Path $saveRoot | Out-Null
          $env:OPENSCARLETT_SAVE_ROOT = $saveRoot
          ctest --test-dir build --output-on-failure --verbose

      - name: Publish probe-gpu and test summary
        if: always()
        shell: pwsh
        run: |
          $summary = @()
          $summary += "### Windows x64 (${{ matrix.build_type }})"
          $summary += ""

          $lastTestLog = "build/Testing/Temporary/LastTest.log"
          if (Test-Path $lastTestLog) {
            $logText = (Get-Content -Raw $lastTestLog) -replace "`r`n", "`n"
            $testMatches = [regex]::Matches($logText, '(?ms)^\d+/\d+ Test: (\S+)\n.*?^Test (Passed|Failed)\.$')
            if ($testMatches.Count -gt 0) {
              $passed = ($testMatches | Where-Object { $_.Groups[2].Value -eq 'Passed' }).Count
              $summary += "**CTest:** ``$passed/$($testMatches.Count)`` passing"
              $summary += ""
              $summary += "| Test | Result |"
              $summary += "| :--- | :---: |"
              foreach ($m in $testMatches) {
                $icon = if ($m.Groups[2].Value -eq 'Passed') { 'PASS' } else { 'FAIL' }
                $summary += "| ``$($m.Groups[1].Value)`` | $icon |"
              }
              $summary += ""
            }
          }

          if (Test-Path "build/openscarlett.exe") {
            $summary += "#### Runner Hardware Probe (``openscarlett probe-gpu``)"
            $summary += '```text'
            $summary += (& .\build\openscarlett.exe probe-gpu 2>&1 | Out-String).TrimEnd()
            $summary += '```'
          }

          $summary -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Package and smoke-test portable Windows x64 bundle
        if: matrix.build_type == 'Release'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = "dist/OpenScarlett-win64"
          if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          Copy-Item "build/openscarlett.exe" $stage
          Get-ChildItem "build" -Filter "*.dll" | Copy-Item -Destination $stage
          Get-ChildItem "build" -Filter "test_*.exe" | Copy-Item -Destination $stage
          Get-ChildItem "build" -Filter "gdk_*.exe" | Copy-Item -Destination $stage
          Copy-Item "tools/run_hardware_test.bat", "tools/run_hardware_test.ps1" $stage
          Copy-Item "README.md", "LICENSE" $stage

          # Bundle open-source DirectXShaderCompiler (dxc.exe + dxcompiler.dll + dxil.dll)
          # so testers without the Windows SDK installed can run all SM 6.5 / GDK / lifter tests.
          $bundledDxc = $false
          try {
            $headers = @{ 'User-Agent' = 'OpenScarlett-CI'; 'Authorization' = "Bearer $env:GH_TOKEN" }
            $rel = Invoke-RestMethod -Uri 'https://api.github.com/repos/microsoft/DirectXShaderCompiler/releases/latest' -Headers $headers
            $asset = $rel.assets | Where-Object { $_.name -match '^dxc_.*\.zip$' } | Select-Object -First 1
            if ($asset) {
              $dxcZip = Join-Path $env:RUNNER_TEMP $asset.name
              $dxcDir = Join-Path $env:RUNNER_TEMP 'dxc_extract'
              if (Test-Path $dxcDir) { Remove-Item -Recurse -Force $dxcDir }
              Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $dxcZip -Headers @{ 'User-Agent' = 'OpenScarlett-CI' }
              Expand-Archive -Path $dxcZip -DestinationPath $dxcDir -Force
              $dxcBin = Join-Path $dxcDir 'bin/x64'
              if (Test-Path (Join-Path $dxcBin 'dxc.exe')) {
                foreach ($f in @('dxc.exe', 'dxcompiler.dll', 'dxil.dll')) {
                  $src = Join-Path $dxcBin $f
                  if (Test-Path $src) { Copy-Item $src $stage }
                }
                $lic = Join-Path $dxcDir 'LICENSE-LLVM.txt'
                if (Test-Path $lic) { Copy-Item $lic (Join-Path $stage 'DXC-LICENSE-LLVM.txt') }
                $bundledDxc = $true
                Write-Host "Bundled DirectXShaderCompiler from official release: $($asset.name)"
              }
            }
          } catch {
            Write-Warning "Could not download microsoft/DirectXShaderCompiler release ($_); falling back to Windows SDK dxc."
          }

          if (-not $bundledDxc) {
            $kitsBin = 'C:\Program Files (x86)\Windows Kits\10\bin'
            if (Test-Path $kitsBin) {
              $sdkDir = Get-ChildItem $kitsBin -Directory |
                Where-Object { Test-Path (Join-Path $_.FullName 'x64\dxc.exe') } |
                Sort-Object Name | Select-Object -Last 1
              if ($sdkDir) {
                $sdkX64 = Join-Path $sdkDir.FullName 'x64'
                foreach ($f in @('dxc.exe', 'dxcompiler.dll', 'dxil.dll')) {
                  $src = Join-Path $sdkX64 $f
                  if (Test-Path $src) { Copy-Item $src $stage }
                }
                Write-Host "Bundled dxc.exe + dxcompiler.dll + dxil.dll from Windows SDK $($sdkDir.Name)"
              }
            }
          }

          Write-Host "Packaged files:"
          Get-ChildItem $stage | Select-Object Name, Length | Format-Table -AutoSize

          Write-Host "Running portable bundle smoke test (hiding build/ so hardcoded build paths fail CI)..."
          Rename-Item -Path "build" -NewName "build_hidden_for_smoke"
          try {
            & "$stage\run_hardware_test.bat" --no-pause
            if ($LASTEXITCODE -ne 0) {
              throw "Portable bundle smoke test failed with exit code $LASTEXITCODE"
            }
          } finally {
            if (Test-Path "build_hidden_for_smoke") {
              Rename-Item -Path "build_hidden_for_smoke" -NewName "build"
            }
          }

          # Remove transient test report generated by the CI smoke test before uploading
          foreach ($transient in @('hardware_test_report.md', 'hardware_test_report.txt')) {
            $p = Join-Path $stage $transient
            if (Test-Path $p) { Remove-Item -Force $p }
          }

      - name: Upload portable Release artifact
        if: matrix.build_type == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: OpenScarlett-win64-Release
          path: dist/OpenScarlett-win64
          retention-days: 30
          if-no-files-found: error

  clang-cl-build-and-test:
    name: Windows x64 Clang-CL (Release)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC x64 developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Locate Clang-CL and Ninja
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            $vsNinja = Join-Path $env:VSINSTALLDIR "Common7\IDE\CommonExtensions\Microsoft\CMake\Ninja"
            if (Test-Path (Join-Path $vsNinja "ninja.exe")) {
              Add-Content -Path $env:GITHUB_PATH -Value $vsNinja
              $env:PATH = "$vsNinja;$env:PATH"
            } else {
              choco install ninja -y --no-progress
            }
          }
          if (-not (Get-Command clang-cl -ErrorAction SilentlyContinue)) {
            $llvmCandidates = @(
              (Join-Path $env:VSINSTALLDIR "VC\Tools\Llvm\x64\bin"),
              "C:\Program Files\LLVM\bin"
            )
            foreach ($dir in $llvmCandidates) {
              if (Test-Path (Join-Path $dir "clang-cl.exe")) {
                Add-Content -Path $env:GITHUB_PATH -Value $dir
                $env:PATH = "$dir;$env:PATH"
                break
              }
            }
          }
          clang-cl --version
          cmake --version
          ninja --version

      - name: Configure (CMake + Ninja + Clang-CL)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake -S . -B build-clangcl -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=clang-cl `
            -DCMAKE_CXX_COMPILER=clang-cl

      - name: Build (Clang-CL)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake --build build-clangcl --parallel

      - name: Run CTest suite (Clang-CL)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $saveRoot = Join-Path $env:RUNNER_TEMP "openscarlett_saves_clangcl"
          New-Item -ItemType Directory -Force -Path $saveRoot | Out-Null
          $env:OPENSCARLETT_SAVE_ROOT = $saveRoot
          ctest --test-dir build-clangcl --output-on-failure --verbose

      - name: Publish Clang-CL test summary
        if: always()
        shell: pwsh
        run: |
          $summary = @()
          $summary += "### Windows x64 Clang-CL (Release)"
          $summary += ""
          if (Get-Command clang-cl -ErrorAction SilentlyContinue) {
            $ver = (& clang-cl --version 2>&1 | Select-Object -First 1)
            $summary += "**Compiler:** ``$ver``"
            $summary += ""
          }
          $lastTestLog = "build-clangcl/Testing/Temporary/LastTest.log"
          if (Test-Path $lastTestLog) {
            $logText = (Get-Content -Raw $lastTestLog) -replace "`r`n", "`n"
            $testMatches = [regex]::Matches($logText, '(?ms)^\d+/\d+ Test: (\S+)\n.*?^Test (Passed|Failed)\.$')
            if ($testMatches.Count -gt 0) {
              $passed = ($testMatches | Where-Object { $_.Groups[2].Value -eq 'Passed' }).Count
              $summary += "**CTest:** ``$passed/$($testMatches.Count)`` passing"
              $summary += ""
              $summary += "| Test | Result |"
              $summary += "| :--- | :---: |"
              foreach ($m in $testMatches) {
                $icon = if ($m.Groups[2].Value -eq 'Passed') { 'PASS' } else { 'FAIL' }
                $summary += "| ``$($m.Groups[1].Value)`` | $icon |"
              }
              $summary += ""
            }
          }
          $summary -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

  mingw64-build:
    name: Windows x64 MinGW-w64 (Non-Blocking Portability Check)
    runs-on: windows-latest
    continue-on-error: true
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSYS2 MinGW-w64 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja

      - name: Verify MinGW-w64 toolchain
        run: |
          x86_64-w64-mingw32-g++ --version
          cmake --version
          ninja --version

      - name: Configure (CMake + Ninja + MinGW-w64)
        run: |
          cmake -S . -B build-mingw -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc \
            -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++

      - name: Build core, d3d12_xs (PR #6 COM/.def), and portable shims
        run: |
          set +e
          mkdir -p build-mingw
          RESULTS_FILE="build-mingw/mingw_target_results.txt"
          : > "$RESULTS_FILE"

          PRIMARY_TARGETS=(
            openscarlett_core
            d3d12_xs
          )
          PORTABLE_TARGETS=(
            xg_xs
            winrt_xs
            kernelx
            xmem
            xgameruntime
            GameInput
            AcpHal
            dstorage_xs
            Microsoft.Xbox.Services.GDK.C
            pixevt
            xcrdapi
            libHttpClient.GDK
            XCurl
            Bink2Scarlett
            amd_fidelityfx_upscaler_xbox
            amd_fidelityfx_loader_xbox
            XboxBvhBuilder
            test_codecs
            test_rdna2_core
            test_winrt_xs
            test_kernelx
            test_d3d12_xs_live
            test_xg_dstorage
            test_dxr_live
            test_secondary_shims
          )

          PRIMARY_FAIL=0
          for t in "${PRIMARY_TARGETS[@]}"; do
            echo "=== Building MinGW-w64 primary target: $t ==="
            if cmake --build build-mingw --target "$t" --parallel; then
              echo "PRIMARY|$t|PASS" >> "$RESULTS_FILE"
            else
              echo "PRIMARY|$t|FAIL" >> "$RESULTS_FILE"
              PRIMARY_FAIL=1
            fi
          done

          for t in "${PORTABLE_TARGETS[@]}"; do
            echo "=== Building MinGW-w64 portable target: $t ==="
            if cmake --build build-mingw --target "$t" --parallel; then
              echo "PORTABLE|$t|PASS" >> "$RESULTS_FILE"
            else
              echo "PORTABLE|$t|FAIL" >> "$RESULTS_FILE"
            fi
          done

          # Run clean-room MinGW unit tests that built cleanly
          TEST_RESULTS_FILE="build-mingw/mingw_test_results.txt"
          : > "$TEST_RESULTS_FILE"
          export OPENSCARLETT_AUDIO_NULL=1
          export OPENSCARLETT_SAVE_ROOT="${RUNNER_TEMP}/openscarlett_saves_mingw"
          mkdir -p "$OPENSCARLETT_SAVE_ROOT"
          for tst in test_codecs test_rdna2_core test_winrt_xs test_kernelx; do
            if [ -x "build-mingw/${tst}.exe" ]; then
              echo "=== Running MinGW-w64 test: $tst ==="
              if "./build-mingw/${tst}.exe"; then
                echo "$tst|PASS" >> "$TEST_RESULTS_FILE"
              else
                echo "$tst|FAIL" >> "$TEST_RESULTS_FILE"
              fi
            fi
          done

          exit $PRIMARY_FAIL

      - name: Publish MinGW-w64 portability summary
        if: always()
        run: |
          {
            echo "### Windows x64 MinGW-w64 Portability Check (Non-Blocking)"
            echo ""
            echo "**Compiler:** \`$(x86_64-w64-mingw32-g++ --version | head -n 1)\`"
            echo ""
            if [ -f "build-mingw/mingw_target_results.txt" ]; then
              PASS_CNT=$(grep -c '|PASS$' build-mingw/mingw_target_results.txt || true)
              TOTAL_CNT=$(wc -l < build-mingw/mingw_target_results.txt | tr -d ' ')
              echo "**Build Targets:** \`${PASS_CNT}/${TOTAL_CNT}\` built cleanly (verifies \`d3d12_xs_mingw.def\`, \`kernelx_mingw.def\`, \`xmem_mingw.def\`, and COM aggregate-return compatibility)"
              echo ""
              echo "| Tier | Target | Build |"
              echo "| :--- | :--- | :---: |"
              while IFS='|' read -r tier tgt res; do
                echo "| ${tier} | \`${tgt}\` | ${res} |"
              done < build-mingw/mingw_target_results.txt
              echo ""
            fi
            if [ -s "build-mingw/mingw_test_results.txt" ]; then
              echo "| MinGW Unit Test | Result |"
              echo "| :--- | :---: |"
              while IFS='|' read -r tst res; do
                echo "| \`${tst}\` | ${res} |"
              done < build-mingw/mingw_test_results.txt
              echo ""
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  publish-release:
    name: Publish Portable GitHub Release (${{ github.ref_name }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-test
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Download portable Release artifact
        uses: actions/download-artifact@v4
        with:
          name: OpenScarlett-win64-Release
          path: release-stage/OpenScarlett-win64

      - name: Create zip archive and SHA256 checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "${{ github.ref_name }}"
          $zipName = "OpenScarlett-$tag-win64.zip"
          Compress-Archive -Path "release-stage/OpenScarlett-win64/*" -DestinationPath $zipName -Force
          $hash = (Get-FileHash -Path $zipName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $zipName" | Out-File -FilePath "$zipName.sha256" -Encoding ascii
          Get-Item $zipName, "$zipName.sha256" | Select-Object Name, Length | Format-Table -AutoSize

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "${{ github.ref_name }}"
          $zipName = "OpenScarlett-$tag-win64.zip"
          $notes = @"
          ## OpenScarlett $tag — Portable Windows x64 Hardware Test Bundle

          **Zero coding or Visual Studio required!** Help us test OpenScarlett across real PC GPUs (NVIDIA RTX, AMD RDNA2/3, Intel Arc/iGPU) and Windows 10/11 builds:

          1. Download **`$zipName`** below and extract it anywhere.
          2. Double-click **`run_hardware_test.bat`** — it probes your GPU(s), runs all automated tests (Vulkan, D3D12 COM proxies, Mesh Shaders, FSR 1.0, ``VirtualAlloc2`` aliasing, RDNA2 shader lifting, DXR 1.1, and live Xbox GDK samples), and displays live results.
          3. Press **Enter** when prompted to open a **pre-filled GitHub Hardware Report** (with personal paths/usernames automatically stripped) and click **Create**!

          > **Clean-Room Policy:** 100% MIT open-source code. Contains bundled open-source Microsoft ``dxc.exe``/``dxcompiler.dll``/``dxil.dll`` so no Windows SDK is required. Never decrypts retail ``.xvc``/``.xvd`` packages.
          "@
          $notesFile = Join-Path $env:RUNNER_TEMP 'release_notes.md'
          [System.IO.File]::WriteAllText($notesFile, $notes, (New-Object System.Text.UTF8Encoding($false)))

          gh release create $tag $zipName "$zipName.sha256" `
            --repo "${{ github.repository }}" `
            --title "OpenScarlett $tag (Early Portable Hardware Test Bundle)" `
            --notes-file $notesFile `
            --latest
